name: ⚙️ Build And Deploy Eleventy Site

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 1 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: 🗄️ Cache npm Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      # Covers both halves of the image pipeline: .cache holds eleventy-fetch
      # responses and the generated OG images, _site/img holds the AVIF/WebP
      # variants. eleventy-img skips any variant whose output file already
      # exists, and filenames are content-addressed, so a changed source is a
      # changed filename and can never collide with a stale entry.
      #
      # The key must change every run. actions/cache only writes on a miss, so
      # the previous static key ("<os>-eleventy-fetch-cache") hit forever after
      # the first run and never saved again - newly generated OG images were
      # silently discarded and re-encoded from scratch on the next build.
      # restore-keys still gives us the most recent cache to start from.
      - name: 💾 Persist Eleventy image + fetch cache
        uses: actions/cache@v6
        with:
          path: |
            ./.cache
            ./_site/img
          key: ${{ runner.os }}-eleventy-media-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-eleventy-media-

      - run: npm install

      - name: 🏗️ Build Eleventy Site
        run: npm run build-ghpages
        env: 
          ELEVENTY_ENV: production

      - name: 📝 List all directory contents
        run: ls -R .  # Debugging: List the contents of the _site directory
    
      - name: 🗃️ Upload _site directory as artifact
        uses: actions/upload-artifact@v7
        with:
          name: _site
          path: ./_site
          # Off by default since upload-artifact v4.4, which silently drops
          # every dotfile the build emits: /.htaccess and /.well-known/.
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: 📝 List ALL directory contents before download
        run: ls -R .  # Debugging: List the contents of the _site directory

      - name: 🗃️ Download _site directory artifact
        uses: actions/download-artifact@v8
        with:
          name: _site
          path: ./_site

      - name: 📝 List ALL directory contents
        run: ls -R .  # Debugging: List the contents of the _site directory    

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: false && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
      
      - name: 📡 Deploy to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_site/
          server-dir: ./
          protocol: ftps
          port: 21
          # Setting `exclude` replaces the action's defaults, so the .git and
          # node_modules patterns have to be repeated here.
          # social-queue.json is build input for the syndicate job below, not
          # something the site needs to serve.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/social-queue.json

  # ---------------------------------------------------------------------------
  # Cross-post new content to Mastodon. Replaces EchoFeed.
  # See docs/echofeed-migration.md.
  #
  # Runs after deploy so a link is only posted once it actually resolves.
  # ---------------------------------------------------------------------------
  syndicate:
    runs-on: ubuntu-22.04
    needs: deploy
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Its own group, separate from the build. The nightly cron can overlap a
    # push run, and two syndicate jobs at once would race on state.json.
    # Never cancel a run in progress: it may have already posted.
    concurrency:
      group: syndicate-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v7
        with:
          # 20, not 18: syndicate.mjs uses the global fetch/FormData/Blob, which
          # are experimental on 18. The build job stays on 18.
          node-version: "20"

      - name: 🗃️ Download _site directory artifact
        uses: actions/download-artifact@v8
        with:
          name: _site
          path: ./_site

      - name: 🦣 Syndicate to Mastodon
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          # Deliberately low while the replacement is being trusted. Raise it
          # once a week of clean runs has been observed.
          MAX_POSTS_PER_RUN: 1
        run: |
          if [ -z "$MASTODON_TOKEN" ]; then
            echo "MASTODON_TOKEN is not set - skipping syndication."
            echo "Set the secret once social/state.json is on main."
            exit 0
          fi
          node social/syndicate.mjs --live

      - name: 📝 Commit the syndication state
        run: |
          if git diff --quiet -- social/state.json; then
            echo "state.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/state.json
          # [skip ci] keeps this commit from starting another build. Pushes made
          # with the default GITHUB_TOKEN do not trigger workflows anyway, so
          # this is a second line of defence, not the only one.
          git commit -m "chore: record syndicated posts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      